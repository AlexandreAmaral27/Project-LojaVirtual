<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="images/logos/fav-icon/letra-a.png" type="image/x-icon">
  <title>A.roy_Store</title>
  <link rel="stylesheet" href="estilo/style-conta.css">
  <link rel="stylesheet" href="estilo/style.css">
  <link rel="stylesheet" href="estilo/mediaquerystyle.css">
  <link rel="stylesheet" href="estilo/menu.css">
  <style>
    /* Faz o body ocupar a tela toda sem rolagem */
    body {
      background-color: rgb(10, 105, 247);
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* impede rolagem */
    }

    .container {
      position: relative;
      top: -5%;
      text-align: center;
      max-width: 348px;
      width: 100%;
      padding: 20px;
      background-color: #8f8b8b24;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    }
    body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;

    background:linear-gradient(
    135deg,
    #0a69f7,
    #004aad,
    #001f54);
}

main{
    flex:1;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px 20px;
}

.account-wrapper{
    width:100%;
    max-width:1100px;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:40px;
    align-items:center;
}

.account-left{
    color:white;
}

.account-left img{
    width:180px;
    margin-bottom:20px;
}

.account-left h1{
    font-size:3rem;
    margin-bottom:15px;
}

.account-left p{
    font-size:1.1rem;
    line-height:1.7;
}

.container{
    background:rgba(255,255,255,.12);

    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.2);

    border-radius:20px;

    padding:35px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.25);
}

.container h2{
    color:white;
    text-align:center;
    margin-bottom:25px;
}

.form-group{
    display:flex;
    flex-direction:column;
    margin-bottom:18px;
    position:relative;
}

.form-group label{
    color:white;
    margin-bottom:8px;
}

.form-group input{
    padding:14px;
    border:none;
    border-radius:10px;
    outline:none;
}

.toggle-password{
    position:absolute;
    right:15px;
    top:42px;
    cursor:pointer;
}

.btn{
    width:100%;
    padding:14px;

    border:none;
    border-radius:50px;

    background:white;
    color:#0a69f7;

    font-weight:bold;
    font-size:16px;

    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

.forgot-password{
    display:block;
    margin-top:15px;
    text-align:center;
    color:white;
    cursor:pointer;
}

.separator{
    margin:25px 0;
    text-align:center;
    color:white;
}

.social-login{
    display:flex;
    gap:10px;
}

.social-login button{
    flex:1;
    padding:12px;

    border:none;
    border-radius:10px;

    cursor:pointer;
}

.toggle-form{
    margin-top:20px;
    text-align:center;
    color:white;
    cursor:pointer;
}

.hidden{
    display:none;
}

@media(max-width:768px){

    .account-wrapper{
        grid-template-columns:1fr;
    }

    .account-left{
        text-align:center;
    }

    .account-left h1{
        font-size:2rem;
    }
}
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <div class="navbar show-menu">
    <div class="headerconteiner">
      <a href="index.html"><img src="images/a.roy/logo.png" alt="" class="logo"></a>
      <nav>
        <ul class="show menu" id="menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="produtos.html">Produtos</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="contacto-nos.html">Contato</a></li>
          <li><a href="conta.html">Conta</a></li>
        </ul>
      </nav>
      <div class="navicon">
        <a href="produtos.html"><img src="images/logos/cart.png"> </a> 
        <div class="navicon2">
          <div class="hamburger" id="hamburger">
            <div></div>
            <div></div>
            <div></div>
          </div>
        </div>
      </div>
    </div>  
  </div>

  <!-- MAIN -->
<main>

    <div class="account-wrapper">

        <div class="account-left">
            <img src="images/a.roy/logo.png" alt="A.roy Store">
            <h1>Bem-vindo à A.roy Store</h1>
            <p>
                Entre na sua conta para acompanhar encomendas,
                guardar favoritos e ter uma experiência personalizada.
            </p>
        </div>

        <div class="account-right">

            <!-- LOGIN -->
            <div class="container">

                <div id="loginForm">

                    <h2>Entrar</h2>

                    <div class="form-group">
                        <label>Email</label>
                        <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Digite o seu email"
                        required>
                    </div>

                    <div class="form-group">
                        <label>Palavra-passe</label>
                        <input
                        type="password"
                        id="loginPassword"
                        name="senha"
                        placeholder="Digite a sua palavra-passe"
                        required>

                        <span
                        class="toggle-password"
                        onclick="togglePassword('loginPassword', this)">
                        👁️
                        </span>
                    </div>

                    <button class="btn" type="button">
                        Entrar
                    </button>

                    <span
                    class="forgot-password"
                    onclick="openModal()">
                    Esqueceu-se da palavra-passe?
                    </span>

                    <div class="separator">
                        <span>ou</span>
                    </div>

                    <div class="social-login">
                        <button type="button">Google</button>
                        <button type="button">Facebook</button>
                    </div>

                    <p class="toggle-form" onclick="toggleForms()">
                        Não tem conta?
                        <strong>Criar conta</strong>
                    </p>

                </div>

                <!-- REGISTO -->
                <div id="registerForm" class="hidden">

                    <h2>Criar Conta</h2>

                    <div class="form-group">
                        <label>Nome</label>
                        <input
                        type="text"
                        id="registerName"
                        placeholder="Digite o seu nome">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input
                        type="email"
                        id="registerEmail"
                        placeholder="Digite o seu email">
                    </div>

                    <div class="form-group">
                        <label>Palavra-passe</label>
                        <input
                        type="password"
                        id="registerPassword"
                        placeholder="Crie uma palavra-passe">

                        <span
                        class="toggle-password"
                        onclick="togglePassword('registerPassword', this)">
                        👁️
                        </span>
                    </div>

                    <button class="btn" type="button">
                        Registar
                    </button>

                    <p class="toggle-form" onclick="toggleForms()">
                        Já tem conta?
                        <strong>Entrar</strong>
                    </p>

                </div>

            </div>

        </div>

    </div>

</main>
  <!-- menu -->
     <script>
        const hamburger = document.getElementById("hamburger");
        const menu = document.getElementById("menu");
    
        hamburger.addEventListener("click", () => {
          hamburger.classList.toggle("active");
          menu.classList.toggle("show");
        });
      </script>
      
<!-- menu -->
</body>
</html>
